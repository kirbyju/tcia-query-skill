  short_description: "Query TCIA datasets and verified TCIA-based publications"
  default_prompt: "Use $tcia-query-skill to verify skill and artifact freshness before querying TCIA-published datasets, clarify whether ambiguous recency means newly published, recently updated, or both, use TCIA Publications EndNote XML for verified manuscripts, prefer IDC/idc-index for public DICOM, preserve clinical provenance and review flags, and explain access, citations, viewers, and download routes."

