name: Resume TCIA metadata V2 release

on:
  workflow_dispatch:
    inputs:
      candidate_run_id:
        description: Failed V2 build run containing tcia-metadata-v2-candidate
        required: true
        type: string
      producer_sha:
        description: Exact producer commit recorded by the candidate
        required: true
        type: string
      semantic_review_commit:
        description: Optional descendant commit containing append-only exact semantic explanations
        required: false
        default: ""
        type: string

permissions:
  actions: read
  attestations: write
  contents: write
  id-token: write

concurrency:
  group: tcia-metadata-v2
  cancel-in-progress: false

jobs:
  resume:
    runs-on: ubuntu-latest
    env:
      PRODUCER_SHA: ${{ inputs.producer_sha }}
    steps:
      - name: Check out exact producer
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.producer_sha }}
          fetch-depth: 0

      - name: Verify producer identity
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$PRODUCER_SHA"

      - name: Verify retained candidate producer and workflow
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
        run: |
          set -euo pipefail
          [[ "$CANDIDATE_RUN_ID" =~ ^[0-9]+$ ]]
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${CANDIDATE_RUN_ID}" > candidate-run.json
          python - <<'PY'
          import json, os
          run = json.load(open('candidate-run.json'))
          assert run['head_sha'] == os.environ['PRODUCER_SHA'], 'Candidate producer mismatch'
          assert run['path'] == '.github/workflows/build-metadata-v2-preview.yml', 'Wrong candidate workflow'
          assert run['conclusion'] == 'failure', 'Only failed retained candidates may be resumed'
          PY

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Install pinned producer dependencies
        run: python -m pip install --require-hashes --requirement requirements-build.lock

      - name: Download retained V2 candidate
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: tcia-metadata-v2-candidate
          run-id: ${{ inputs.candidate_run_id }}
          github-token: ${{ github.token }}

      - name: Import optional append-only exact semantic review
        if: inputs.semantic_review_commit != ''
        env:
          REVIEW_COMMIT: ${{ inputs.semantic_review_commit }}
        run: |
          set -euo pipefail
          [[ "$REVIEW_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          git fetch origin "$REVIEW_COMMIT"
          git merge-base --is-ancestor "$PRODUCER_SHA" "$REVIEW_COMMIT"
          git diff --name-only "$PRODUCER_SHA" "$REVIEW_COMMIT" > review-paths.txt
          python - <<'PY'
          from pathlib import Path
          allowed = {
              'references/correction-semantic-explanations-v1.json',
              'scripts/tests/test_tcia_correction_registry.py',
              'scripts/tests/test_tcia_release_workflow_contract.py',
              'skill_version.json',
              '.github/workflows/resume-metadata-v2-release.yml',
              'references/maintainer-operations.md',
          }
          changed = set(Path('review-paths.txt').read_text().splitlines())
          assert changed <= allowed, f'Review changes producer code or inputs: {sorted(changed - allowed)}'
          PY
          git show "$REVIEW_COMMIT:references/correction-semantic-explanations-v1.json" > reviewed-explanations.json
          PYTHONPATH=scripts python - <<'PY'
          import hashlib, json, os, sqlite3
          from pathlib import Path
          import tcia_correction_registry as registry
          path = Path('reviewed-explanations.json')
          old = json.load(open('references/correction-semantic-explanations-v1.json'))
          new = json.loads(path.read_text())
          assert set(old) == set(new) and old['schema_version'] == new['schema_version']
          for key, values in old.items():
              if not isinstance(values, list):
                  assert values == new[key]
              elif key not in {'explanations', 'explanation_batches', 'aggregate_explanation_batches'}:
                  assert values == new[key], 'Non-semantic declarations changed'
              else:
                  encoded = {registry.canonical_json(item) for item in new[key]}
                  assert all(registry.canonical_json(item) in encoded for item in values), 'Review edits or removes an existing approval'
          with sqlite3.connect('cache/tcia_correction_registry.sqlite') as conn:
              conn.row_factory = sqlite3.Row
              registry.migrate_semantic_explanations(conn, path)
              for key, value in {
                  'semantic_review_commit': os.environ['REVIEW_COMMIT'],
                  'semantic_review_input_sha256': hashlib.sha256(path.read_bytes()).hexdigest(),
                  'candidate_producer_commit': os.environ['PRODUCER_SHA'],
              }.items():
                  conn.execute('INSERT OR REPLACE INTO registry_meta VALUES (?,?)', (key, value))
          PY
          python scripts/tcia_correction_registry.py validate --db cache/tcia_correction_registry.sqlite

      - name: Replay and consume exact semantic explanations
        run: |
          set -euo pipefail
          python scripts/tcia_metadata_change_report.py \
            --existing-report cache/reports/metadata_change_report_final.json \
            --explanations-db cache/tcia_correction_registry.sqlite \
            --json-out cache/reports/metadata_change_report_final.json \
            --fail-on-unexplained-high
          python scripts/tcia_correction_registry.py consume-explanations \
            --db cache/tcia_correction_registry.sqlite \
            --report cache/reports/metadata_change_report_final.json
          python scripts/tcia_correction_registry.py package \
            --db cache/tcia_correction_registry.sqlite \
            --gzip-out dist/tcia_correction_registry.sqlite.gz \
            --manifest-out dist/tcia_correction_registry_manifest.json

      - name: Rebuild and validate only the bundle layer
        id: bundle
        run: |
          set -euo pipefail
          python scripts/tcia_v2_bundle.py build \
            --asset-dir dist \
            --source-tag "workflow-artifact:update-tcia-metadata-v2-source-inputs" \
            --release-channel stable \
            --release-tag tcia-metadata-v2-latest \
            --producer-commit "$PRODUCER_SHA" \
            --producer-skill-version "$(python -c 'import json; print(json.load(open("skill_version.json"))["skill_version"])')" \
            --release-contract streamlined \
            --out dist/tcia_metadata_v2_bundle_manifest.json
          python scripts/tcia_v2_bundle.py validate \
            --asset-dir dist \
            --manifest dist/tcia_metadata_v2_bundle_manifest.json
          python scripts/tcia_v2_bundle.py materialize \
            --asset-dir dist \
            --manifest dist/tcia_metadata_v2_bundle_manifest.json \
            --out-dir release-dist
          fingerprint="$(python -c 'import json; print(json.load(open("release-dist/tcia_metadata_v2_bundle_manifest.json"))["release_fingerprint"])')"
          release_date="$(python -c 'import json; print(json.load(open("release-dist/tcia_metadata_v2_bundle_manifest.json"))["generated_at_utc"][:10].replace("-", "."))')"
          echo "fingerprint=$fingerprint" >> "$GITHUB_OUTPUT"
          echo "immutable_tag=tcia-metadata-v2-${release_date}-${fingerprint:0:12}" >> "$GITHUB_OUTPUT"

      - name: Run V2 contract tests on the original producer
        run: |
          python -m unittest \
            scripts.tests.test_tcia_idc_participant_projection \
            scripts.tests.test_tcia_artifact_model \
            scripts.tests.test_tcia_v2_audit \
            scripts.tests.test_tcia_v2_checkpoint \
            scripts.tests.test_tcia_v2_parity \
            scripts.tests.test_tcia_v2_staging \
            scripts.tests.test_tcia_v2_bundle

      - name: Attest resumed validated V2 bundle provenance
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-path: release-dist/*

      - name: Publish immutable bundle idempotently
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.bundle.outputs.immutable_tag }}
        run: |
          set -euo pipefail
          publish_dir="release-dist"
          asset_matches() {
            local release_tag="$1" path="$2" name local_size local_sha remote
            name="$(basename "$path")"
            local_size="$(stat -c '%s' "$path")"
            local_sha="$(sha256sum "$path" | cut -d' ' -f1)"
            remote="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${release_tag}" \
              --jq ".assets[] | select(.name == \"${name}\") | [.size, (.digest // \"\")] | @tsv")"
            [ "$remote" = "${local_size}"$'\t'"sha256:${local_sha}" ]
          }
          upload_exact() {
            local release_tag="$1" path="$2" name attempt
            name="$(basename "$path")"
            if asset_matches "$release_tag" "$path"; then return 0; fi
            gh release delete-asset "$release_tag" "$name" --yes >/dev/null 2>&1 || true
            for attempt in 1 2 3; do
              if gh release upload "$release_tag" "$path" && asset_matches "$release_tag" "$path"; then return 0; fi
              if asset_matches "$release_tag" "$path"; then return 0; fi
              sleep 5
            done
            return 1
          }
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" \
              --target "$PRODUCER_SHA" \
              --title "TCIA metadata V2 ${RELEASE_TAG#tcia-metadata-v2-}" \
              --notes "Immutable TCIA Metadata Artifact Model V2 generation resumed from a validated candidate checkpoint."
          fi
          for asset in "$publish_dir"/*; do upload_exact "$RELEASE_TAG" "$asset"; done
          gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${RELEASE_TAG}" > immutable-release.json
          python scripts/tcia_v2_bundle.py validate-published \
            --manifest "$publish_dir/tcia_metadata_v2_bundle_manifest.json" \
            --release-json immutable-release.json

      - name: Update and validate moving latest alias idempotently
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="tcia-metadata-v2-latest"
          publish_dir="release-dist"
          asset_matches() {
            local release_tag="$1" path="$2" name local_size local_sha remote
            name="$(basename "$path")"
            local_size="$(stat -c '%s' "$path")"
            local_sha="$(sha256sum "$path" | cut -d' ' -f1)"
            remote="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${release_tag}" \
              --jq ".assets[] | select(.name == \"${name}\") | [.size, (.digest // \"\")] | @tsv")"
            [ "$remote" = "${local_size}"$'\t'"sha256:${local_sha}" ]
          }
          upload_exact() {
            local release_tag="$1" path="$2" name attempt
            name="$(basename "$path")"
            if asset_matches "$release_tag" "$path"; then return 0; fi
            gh release delete-asset "$release_tag" "$name" --yes >/dev/null 2>&1 || true
            for attempt in 1 2 3; do
              if gh release upload "$release_tag" "$path" && asset_matches "$release_tag" "$path"; then return 0; fi
              if asset_matches "$release_tag" "$path"; then return 0; fi
              sleep 5
            done
            return 1
          }
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" \
              --target "$PRODUCER_SHA" \
              --title "TCIA metadata V2 latest" \
              --notes "Validated TCIA Metadata Artifact Model V2 bundle."
          fi
          for asset in "$publish_dir"/*; do
            [ "$(basename "$asset")" = "tcia_metadata_v2_bundle_manifest.json" ] || upload_exact "$tag" "$asset"
          done
          while read -r name; do
            [ -f "$publish_dir/$name" ] || gh release delete-asset "$tag" "$name" --yes
          done < <(gh release view "$tag" --json assets --jq '.assets[].name')
          upload_exact "$tag" "$publish_dir/tcia_metadata_v2_bundle_manifest.json"
          gh api --method PATCH \
            "repos/${GITHUB_REPOSITORY}/git/refs/tags/${tag}" \
            -f sha="$PRODUCER_SHA" -F force=true >/dev/null
          gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${tag}" > latest-release.json
          python scripts/tcia_v2_bundle.py validate-published \
            --manifest "$publish_dir/tcia_metadata_v2_bundle_manifest.json" \
            --release-json latest-release.json
