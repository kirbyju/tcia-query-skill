name: Build TCIA metadata V2

on:
  workflow_run:
    workflows: ["Build TCIA metadata V2 source inputs"]
    types: [completed]

permissions:
  actions: read
  attestations: write
  contents: write
  id-token: write

concurrency:
  group: tcia-metadata-v2
  cancel-in-progress: false

jobs:
  build:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    env:
      PRODUCER_SHA: ${{ github.event.workflow_run.head_sha }}
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Verify triggering producer identity
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$PRODUCER_SHA"

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Resolve effective release configuration
        id: release_config
        shell: bash
        run: |
          set -euo pipefail
          publish_channel="stable"
          include_pathdb_files="true"
          release_contract="streamlined"
          {
            echo "publish_channel=$publish_channel"
            echo "include_pathdb_files=$include_pathdb_files"
            echo "release_contract=$release_contract"
          } >> "$GITHUB_OUTPUT"
          {
            echo "### Effective V2 release configuration"
            echo "- Event: ${{ github.event_name }}"
            echo "- Publish channel: $publish_channel"
            echo "- Release contract: $release_contract"
            echo "- Include PathDB files: $include_pathdb_files"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Install pinned producer dependencies
        run: python -m pip install --require-hashes --requirement requirements-build.lock

      - name: Download validated V2 source inputs from the triggering run
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: tcia-metadata-v2-source
          path: dist
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Prepare validated V2 source inputs
        run: |
          set -euo pipefail
          mkdir -p cache dist
          for asset in \
            tcia_snapshot.sqlite.gz \
            controlled_access_metadata.sqlite.gz \
            clinical_metadata.sqlite.gz \
            tcia_correction_registry.sqlite.gz; do
            gzip -dc "dist/$asset" > "cache/${asset%.gz}"
          done
          python scripts/tcia_correction_registry.py validate \
            --db cache/tcia_correction_registry.sqlite

      - name: Reject unsafe source state before expensive downstream builds
        run: |
          set -euo pipefail
          waiver_args=()
          if [ -s .github/tcia-v2-source-health-waiver.json ]; then
            waiver_args+=(--source-health-waiver .github/tcia-v2-source-health-waiver.json)
          fi
          python scripts/tcia_v2_bundle.py preflight-source-health \
            --asset-dir dist \
            --release-channel stable \
            "${waiver_args[@]}"

      - name: Download and verify the canonical non-DICOM geometry seed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          geometry_manifest="references/public_non_dicom_geometry_results_manifest.json"
          geometry_tag=$(jq -r '.release_tag' "$geometry_manifest")
          geometry_asset=$(jq -r '.asset_name' "$geometry_manifest")
          gh release download "$geometry_tag" \
            --pattern "$geometry_asset" \
            --dir dist \
            --clobber
          python scripts/tcia_geometry_seed.py verify-release \
            --manifest "$geometry_manifest" \
            --gzip "dist/$geometry_asset" \
            --coverage-dir references/public_non_dicom_geometry_coverage \
            --out cache/public_non_dicom_geometry_seed.sqlite

      - name: Capture and validate the unified V2 build baseline
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          baseline_tag="tcia-metadata-v2-latest"
          gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${baseline_tag}" \
            > cache/baseline_release.json
          for asset in \
            tcia_metadata_v2_bundle_manifest.json \
            public_non_dicom_metadata.sqlite.gz \
            public_non_dicom_audit.sqlite.gz \
            participant_inventory.sqlite.gz; do
            gh release download "$baseline_tag" --pattern "$asset" --dir dist --clobber
          done
          python scripts/tcia_v2_bundle.py validate-selection \
            --asset-dir dist \
            --manifest dist/tcia_metadata_v2_bundle_manifest.json \
            --source-release-json cache/baseline_release.json \
            --asset public_non_dicom_metadata.sqlite.gz \
            --asset public_non_dicom_audit.sqlite.gz \
            --asset participant_inventory.sqlite.gz
          gzip -dc dist/public_non_dicom_metadata.sqlite.gz \
            > cache/public_non_dicom_baseline.sqlite
          gzip -dc dist/public_non_dicom_audit.sqlite.gz \
            > cache/public_non_dicom_audit_baseline.sqlite
          gzip -dc dist/participant_inventory.sqlite.gz \
            > cache/participant_inventory_baseline.sqlite
          jq '.components.public_non_dicom' \
            dist/tcia_metadata_v2_bundle_manifest.json \
            > cache/public_non_dicom_baseline_manifest.json
          jq '.components.public_non_dicom_audit' \
            dist/tcia_metadata_v2_bundle_manifest.json \
            > cache/public_non_dicom_audit_baseline_manifest.json

      - name: Materialize the lossless unified V2 assembly and checkpoint
        run: |
          python scripts/tcia_v2_audit.py materialize-assembly \
            --artifact public_non_dicom \
            --research-db cache/public_non_dicom_baseline.sqlite \
            --audit-db cache/public_non_dicom_audit_baseline.sqlite \
            --out cache/public_non_dicom_metadata.sqlite \
            --replace
          python scripts/tcia_v2_checkpoint.py extract-from-audit \
            --audit-db cache/public_non_dicom_audit_baseline.sqlite \
            --out cache/tcia_v2_legacy_detail_checkpoint.sqlite \
            --replace
          python scripts/tcia_v2_checkpoint.py validate \
            --db cache/tcia_v2_legacy_detail_checkpoint.sqlite

      - name: Build the direct IDC participant projection
        run: |
          python scripts/tcia_idc_participant_projection.py build \
            --snapshot-db cache/tcia_snapshot.sqlite \
            --out cache/idc_participant_projection.sqlite \
            --manifest-out cache/idc_participant_projection_manifest.json \
            --replace
          python scripts/tcia_idc_participant_projection.py validate \
            --db cache/idc_participant_projection.sqlite \
            --min-collection-memberships 75000 \
            --min-collections 145 \
            --min-analysis-result-memberships 4337 \
            --min-analysis-results 11

      - name: Build the runner-local V2 staging ledger
        run: |
          python scripts/tcia_v2_staging.py build \
            --snapshot-db cache/tcia_snapshot.sqlite \
            --snapshot-manifest dist/tcia_snapshot_manifest.json \
            --public-non-dicom-baseline-db cache/public_non_dicom_baseline.sqlite \
            --public-non-dicom-baseline-manifest cache/public_non_dicom_baseline_manifest.json \
            --public-non-dicom-audit-baseline-db cache/public_non_dicom_audit_baseline.sqlite \
            --public-non-dicom-audit-baseline-manifest cache/public_non_dicom_audit_baseline_manifest.json \
            --controlled-access-db cache/controlled_access_metadata.sqlite \
            --controlled-access-manifest dist/controlled_access_metadata_manifest.json \
            --clinical-db cache/clinical_metadata.sqlite \
            --clinical-manifest dist/clinical_metadata_manifest.json \
            --idc-participants-db cache/idc_participant_projection.sqlite \
            --idc-participants-manifest cache/idc_participant_projection_manifest.json \
            --baseline-bundle-manifest dist/tcia_metadata_v2_bundle_manifest.json \
            --out cache/tcia_metadata_v2_staging.sqlite \
            --replace
          python scripts/tcia_v2_staging.py validate \
            --db cache/tcia_metadata_v2_staging.sqlite \
            --verify-sources

      - name: Regenerate the complete web export set from the bundled snapshot
        run: |
          python scripts/tcia_v2_bundle.py exports \
            --snapshot-db cache/tcia_snapshot.sqlite \
            --out-dir dist

      - name: Build public non-DICOM metadata
        run: |
          set -euo pipefail
          pathdb_args=()
          if [ "${{ steps.release_config.outputs.include_pathdb_files }}" = "false" ]; then
            pathdb_args+=(--no-pathdb-files)
          fi
          python scripts/tcia_public_non_dicom_metadata.py build \
            --staging-db cache/tcia_metadata_v2_staging.sqlite \
            --baseline-db cache/public_non_dicom_metadata.sqlite \
            --crosswalk-csv references/public_non_dicom_crosswalks_v1.csv \
            --crosswalk-curation references/public-non-dicom-crosswalk-curation-v1.json \
            --image-metadata-csv references/public_non_dicom_image_metadata_v1.csv \
            --out cache/public_non_dicom_metadata.sqlite \
            --replace \
            "${pathdb_args[@]}"
          mkdir -p cache/reports
          python scripts/tcia_geometry_batch.py plan \
            --db cache/public_non_dicom_metadata.sqlite \
            --out-dir cache/current-geometry-plan
          python scripts/tcia_geometry_seed.py compare \
            --seed-db cache/public_non_dicom_geometry_seed.sqlite \
            --jobs-csv cache/current-geometry-plan/jobs.csv \
            --coverage-dir references/public_non_dicom_geometry_coverage \
            --filtered-coverage-dir cache/current-geometry-coverage \
            --out cache/current-public-non-dicom-geometry.sqlite \
            --report-json cache/reports/public_non_dicom_geometry_refresh.json \
            --report-csv cache/reports/public_non_dicom_geometry_refresh.csv
          geometry_coverage_args=()
          shopt -s nullglob
          for coverage in cache/current-geometry-coverage/*.json; do
            geometry_coverage_args+=(--geometry-coverage "$coverage")
          done
          python scripts/tcia_public_non_dicom_metadata.py import-geometry \
            --db cache/public_non_dicom_metadata.sqlite \
            --geometry-results cache/current-public-non-dicom-geometry.sqlite \
            --published-db cache/public_non_dicom_baseline.sqlite \
            "${geometry_coverage_args[@]}"
          {
            echo "### Public non-DICOM geometry seed"
            python - <<'PY'
          import json
          report = json.load(open("cache/reports/public_non_dicom_geometry_refresh.json"))
          counts = report["status_counts"]
          print(f"- Unchanged jobs imported: {counts.get('unchanged', 0)}")
          print(f"- New jobs requiring HPC analysis: {counts.get('new', 0)}")
          print(f"- Changed jobs requiring HPC analysis: {counts.get('changed', 0)}")
          print(f"- Removed jobs pruned: {counts.get('removed', 0)}")
          PY
          } >> "$GITHUB_STEP_SUMMARY"
          python scripts/tcia_public_non_dicom_metadata.py validate \
            --db cache/public_non_dicom_metadata.sqlite
          mv cache/public_non_dicom_metadata.sqlite cache/public_non_dicom_assembly.sqlite
          python scripts/tcia_v2_audit.py project-v3 \
            --artifact public_non_dicom \
            --db cache/public_non_dicom_assembly.sqlite \
            --research-out cache/public_non_dicom_metadata.sqlite \
            --audit-out cache/public_non_dicom_audit.sqlite \
            --research-gzip-out dist/public_non_dicom_metadata.sqlite.gz \
            --research-manifest-out dist/public_non_dicom_metadata_manifest.json \
            --audit-gzip-out dist/public_non_dicom_audit.sqlite.gz \
            --audit-manifest-out dist/public_non_dicom_audit_manifest.json \
            --staging-db cache/tcia_metadata_v2_staging.sqlite \
            --checkpoint-db cache/tcia_v2_legacy_detail_checkpoint.sqlite \
            --consume-checkpoint \
            --gzip-level 3 \
            --metrics-out cache/reports/tcia_v2_compact_audit_metrics.json \
            --replace
          python scripts/tcia_v2_audit.py verify-reconstruction \
            --source-db cache/public_non_dicom_assembly.sqlite \
            --audit-db cache/public_non_dicom_audit.sqlite \
            --sample-size 1000 \
            --out cache/reports/tcia_v2_compact_audit_reconstruction.json
          rm -f cache/public_non_dicom_assembly.sqlite
          {
            echo "### Compact V2 audit build"
            python -c 'import json; d=json.load(open("cache/reports/tcia_v2_compact_audit_metrics.json")); s=d["output_sizes"]; print("- Projection: {:.1f} seconds\n- Compression: {:.1f} seconds\n- Research SQLite/gzip: {:,} / {:,} bytes\n- Audit SQLite/gzip: {:,} / {:,} bytes".format(d["total_projection_seconds"],d["compression"]["compression_seconds"],s["research_sqlite_bytes"],s["research_gzip_bytes"],s["audit_sqlite_bytes"],s["audit_gzip_bytes"]))'
          } >> "$GITHUB_STEP_SUMMARY"
          python scripts/tcia_public_non_dicom_metadata.py validate \
            --db cache/public_non_dicom_metadata.sqlite
          python scripts/tcia_v2_audit.py validate \
            --artifact public_non_dicom \
            --db cache/public_non_dicom_audit.sqlite

      - name: Build Participant Inventory
        run: |
          python scripts/tcia_participant_inventory.py build \
            --staging-db cache/tcia_metadata_v2_staging.sqlite \
            --public-db cache/public_non_dicom_metadata.sqlite \
            --public-audit-db cache/public_non_dicom_audit.sqlite \
            --out cache/participant_inventory.sqlite \
            --replace
          # C-NMC 2019 final-test identities were not published. The reviewed
          # crosswalk therefore removes the synthetic NA_final participant
          # while retaining all 2,586 files as source_confirmed_unavailable.
          # The reviewed BCBM crosswalk also replaces 223 filename-derived
          # identities with the 165 source-confirmed clinical participants.
          # The official I-SPY2 clinical crosswalk consolidates 985 research-ID
          # aliases with their corresponding ISPY2-prefixed DICOM PatientIDs.
          # CPTAC-Glioblastoma-CODEX is authoritatively published as an
          # Analysis Result, so it must not inflate Collection coverage.
          python scripts/tcia_participant_inventory.py validate \
            --db cache/participant_inventory.sqlite \
            --min-collection-participants 124674 \
            --min-collections 221 \
            --min-analysis-result-participants 11730 \
            --min-analysis-results 29
          # Participant Inventory is now self-contained for search/summary.
          rm -f cache/clinical_metadata.sqlite cache/controlled_access_metadata.sqlite
          python scripts/tcia_v2_audit.py split \
            --artifact participant_inventory \
            --db cache/participant_inventory.sqlite \
            --audit-out cache/participant_inventory_audit.sqlite \
            --clinical-qc-csv dist/clinical_qc_manual_review.csv \
            --research-gzip-out dist/participant_inventory.sqlite.gz \
            --research-manifest-out dist/participant_inventory_manifest.json \
            --audit-gzip-out dist/participant_inventory_audit.sqlite.gz \
            --audit-manifest-out dist/participant_inventory_audit_manifest.json \
            --replace
          python scripts/tcia_participant_inventory.py validate \
            --db cache/participant_inventory.sqlite
          python scripts/tcia_v2_audit.py validate \
            --artifact participant_inventory \
            --db cache/participant_inventory_audit.sqlite

      - name: Enforce exact semantic change explanations
        run: |
          python scripts/tcia_metadata_change_report.py \
            --public-new cache/public_non_dicom_metadata.sqlite \
            --public-old cache/public_non_dicom_baseline.sqlite \
            --participant-new cache/participant_inventory.sqlite \
            --participant-old cache/participant_inventory_baseline.sqlite \
            --explanations-db cache/tcia_correction_registry.sqlite \
            --geometry-refresh-report cache/reports/public_non_dicom_geometry_refresh.json \
            --fail-on-unexplained-high \
            --github-actions \
            --markdown-out cache/reports/metadata_change_report_final.md \
            --json-out cache/reports/metadata_change_report_final.json
          python scripts/tcia_correction_registry.py consume-explanations \
            --db cache/tcia_correction_registry.sqlite \
            --report cache/reports/metadata_change_report_final.json
          python scripts/tcia_correction_registry.py package \
            --db cache/tcia_correction_registry.sqlite \
            --gzip-out dist/tcia_correction_registry.sqlite.gz \
            --manifest-out dist/tcia_correction_registry_manifest.json
          cat cache/reports/metadata_change_report_final.md >> "$GITHUB_STEP_SUMMARY"
          rm -f cache/public_non_dicom_baseline.sqlite \
            cache/public_non_dicom_audit_baseline.sqlite \
            cache/participant_inventory_baseline.sqlite

      - name: Run V2 contract tests
        run: |
          python -m unittest \
            scripts.tests.test_tcia_idc_participant_projection \
            scripts.tests.test_tcia_artifact_model \
            scripts.tests.test_tcia_v2_audit \
            scripts.tests.test_tcia_v2_checkpoint \
            scripts.tests.test_tcia_v2_parity \
            scripts.tests.test_tcia_v2_staging \
            scripts.tests.test_tcia_v2_bundle

      - name: Retain staging diagnostics for maintainers
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: tcia-metadata-v2-staging-diagnostics
          path: |
            cache/tcia_metadata_v2_staging.sqlite
            cache/idc_participant_projection.sqlite
            cache/idc_participant_projection_manifest.json
            cache/reports/tcia_v2_compact_audit_metrics.json
            cache/reports/tcia_v2_compact_audit_reconstruction.json
            cache/reports/metadata_change_report_final.md
            cache/reports/metadata_change_report_final.json
            dist/metadata_change_report.md
            dist/metadata_change_report.json
          if-no-files-found: ignore
          retention-days: 30

      - name: Build and validate the complete V2 bundle contract
        run: |
          release_channel="stable"
          release_tag="tcia-metadata-v2-latest"
          release_contract="${{ steps.release_config.outputs.release_contract }}"
          waiver_args=()
          if [ -s .github/tcia-v2-source-health-waiver.json ]; then
            waiver_args+=(--source-health-waiver .github/tcia-v2-source-health-waiver.json)
          fi
          python scripts/tcia_v2_bundle.py build \
            --asset-dir dist \
            --source-tag "workflow-artifact:update-tcia-metadata-v2-source-inputs" \
            --release-channel "$release_channel" \
            --release-tag "$release_tag" \
            --producer-commit "$PRODUCER_SHA" \
            --producer-skill-version "$(python -c 'import json; print(json.load(open("skill_version.json"))["skill_version"])')" \
            --release-contract "$release_contract" \
            "${waiver_args[@]}" \
            --out dist/tcia_metadata_v2_bundle_manifest.json
          python scripts/tcia_v2_bundle.py validate \
            --asset-dir dist \
            --manifest dist/tcia_metadata_v2_bundle_manifest.json
          python scripts/tcia_v2_bundle.py materialize \
            --asset-dir dist \
            --manifest dist/tcia_metadata_v2_bundle_manifest.json \
            --out-dir release-dist

      - name: Decide whether to publish V2 release assets
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          channel="stable"
          tag="tcia-metadata-v2-latest"
          publish="false"
          manifest_path="release-dist/tcia_metadata_v2_bundle_manifest.json"
          new_fingerprint="$(python -c 'import json,sys; print(json.load(open(sys.argv[1]))["release_fingerprint"])' "$manifest_path")"
          old_fingerprint=""
          mkdir -p previous-v2
          if gh release download "$tag" --pattern tcia_metadata_v2_bundle_manifest.json --dir previous-v2 --clobber >/dev/null 2>&1; then
            old_fingerprint="$(python -c 'import json; print(json.load(open("previous-v2/tcia_metadata_v2_bundle_manifest.json")).get("release_fingerprint", ""))')"
          fi
          if [ "$new_fingerprint" != "$old_fingerprint" ]; then
            publish="true"
            reason="complete V2 bundle fingerprint changed"
          else
            reason="complete V2 bundle fingerprint unchanged"
          fi
          release_date="$(python -c 'import json,sys; print(json.load(open(sys.argv[1]))["generated_at_utc"][:10].replace("-", "."))' "$manifest_path")"
          immutable_tag="tcia-metadata-v2-${release_date}-${new_fingerprint:0:12}"
          echo "publish=$publish" >> "$GITHUB_OUTPUT"
          echo "channel=$channel" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "reason=$reason" >> "$GITHUB_OUTPUT"
          echo "immutable_tag=$immutable_tag" >> "$GITHUB_OUTPUT"
          echo "### V2 release decision" >> "$GITHUB_STEP_SUMMARY"
          echo "- Publish: $publish" >> "$GITHUB_STEP_SUMMARY"
          echo "- Reason: $reason" >> "$GITHUB_STEP_SUMMARY"
          echo "- Immutable tag: $immutable_tag" >> "$GITHUB_STEP_SUMMARY"

      - name: Attest validated V2 bundle provenance
        if: steps.release.outputs.publish == 'true'
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-path: release-dist/*

      - name: Publish immutable validated V2 release
        if: steps.release.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${{ steps.release.outputs.immutable_tag }}"
          publish_dir="release-dist"
          notes="Immutable TCIA Metadata Artifact Model V2 generation. Promote or roll back by its manifest fingerprint; tcia-metadata-v2-latest remains the moving compatibility alias."
          resolve_tag_sha() {
            local ref_json object_type object_sha
            ref_json="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/$1")"
            object_type="$(jq -r '.object.type' <<<"$ref_json")"
            object_sha="$(jq -r '.object.sha' <<<"$ref_json")"
            if [ "$object_type" = "tag" ]; then
              object_sha="$(gh api "repos/${GITHUB_REPOSITORY}/git/tags/${object_sha}" --jq '.object.sha')"
            fi
            printf '%s\n' "$object_sha"
          }
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Immutable release already exists; validating without overwriting."
          else
            gh release create "$tag" "$publish_dir"/* \
              --target "$PRODUCER_SHA" \
              --title "TCIA metadata V2 ${tag#tcia-metadata-v2-}" \
              --notes "$notes"
          fi
          test "$(resolve_tag_sha "$tag")" = "$PRODUCER_SHA"
          gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${tag}" > immutable-release.json
          python scripts/tcia_v2_bundle.py validate-published \
            --manifest "$publish_dir/tcia_metadata_v2_bundle_manifest.json" \
            --release-json immutable-release.json

      - name: Update moving latest alias after immutable publication
        if: steps.release.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${{ steps.release.outputs.tag }}"
          channel="${{ steps.release.outputs.channel }}"
          release_contract="${{ steps.release_config.outputs.release_contract }}"
          publish_dir="release-dist"
          notes="TCIA Metadata Artifact Model V2 bundle. The manifest defines research-core, research-detail, audit-support, and compatibility-export profiles. Participant Inventory is compact by default; unified public non-DICOM file-grain metadata and verbose audit evidence are optional hash-pinned companions. Public DICOM detail remains authoritative in IDC. Historical specialized NIfTI and pathology evidence is retained in the public audit companion; standalone detail artifacts are retired from production."
          title="TCIA metadata V2 latest"
          backup_dir="previous-v2-alias"
          alias_existed="false"
          old_tag_sha=""
          resolve_tag_sha() {
            local ref_json object_type object_sha
            ref_json="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/$1")"
            object_type="$(jq -r '.object.type' <<<"$ref_json")"
            object_sha="$(jq -r '.object.sha' <<<"$ref_json")"
            if [ "$object_type" = "tag" ]; then
              object_sha="$(gh api "repos/${GITHUB_REPOSITORY}/git/tags/${object_sha}" --jq '.object.sha')"
            fi
            printf '%s\n' "$object_sha"
          }
          restore_alias() {
            set +e
            trap - ERR
            echo "::warning title=V2 alias restoration::Moving alias update failed; restoring the prior release."
            if [ "$alias_existed" = "true" ]; then
              while read -r asset; do
                [ -z "$asset" ] || gh release delete-asset "$tag" "$asset" --yes || return 1
              done < <(gh release view "$tag" --json assets --jq '.assets[].name')
              mapfile -t backup_assets < <(find "$backup_dir/assets" -maxdepth 1 -type f -print)
              if [ "${#backup_assets[@]}" -gt 0 ]; then
                gh release upload "$tag" "${backup_assets[@]}" --clobber || return 1
              fi
              gh release edit "$tag" \
                --title "$(jq -r '.name' "$backup_dir/release-metadata.json")" \
                --notes-file "$backup_dir/release-notes.txt" || return 1
              gh api --method PATCH \
                "repos/${GITHUB_REPOSITORY}/git/refs/tags/${tag}" \
                -f sha="$old_tag_sha" -F force=true >/dev/null || return 1
              gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${tag}" \
                > "$backup_dir/restored-release.json" || return 1
              python scripts/tcia_v2_bundle.py validate-published \
                --manifest "$backup_dir/assets/tcia_metadata_v2_bundle_manifest.json" \
                --release-json "$backup_dir/restored-release.json" || return 1
              test "$(resolve_tag_sha "$tag")" = "$old_tag_sha" || return 1
            else
              gh release delete "$tag" --yes --cleanup-tag || return 1
            fi
          }
          on_alias_error() {
            local status=$?
            if ! restore_alias; then
              echo "::error title=V2 alias restoration failed::Manual restoration from the immutable release is required."
            fi
            exit "$status"
          }
          if gh release view "$tag" >/dev/null 2>&1; then
            alias_existed="true"
            mkdir -p "$backup_dir/assets"
            gh release view "$tag" --json name,body > "$backup_dir/release-metadata.json"
            jq -r '.body' "$backup_dir/release-metadata.json" > "$backup_dir/release-notes.txt"
            gh release download "$tag" --dir "$backup_dir/assets"
            old_tag_sha="$(resolve_tag_sha "$tag")"
            gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${tag}" \
              > "$backup_dir/release.json"
            python scripts/tcia_v2_bundle.py validate-published \
              --manifest "$backup_dir/assets/tcia_metadata_v2_bundle_manifest.json" \
              --release-json "$backup_dir/release.json"
          fi
          trap on_alias_error ERR
          if [ "$alias_existed" = "false" ]; then
            gh release create "$tag" \
              --target "$PRODUCER_SHA" \
              --title "$title" \
              --notes "$notes"
          fi
          if [ "$alias_existed" = "true" ]; then
            gh release edit "$tag" \
              --title "$title" \
              --notes "$notes"
          fi
          previous_manifest=""
          if [ -s previous-v2/tcia_metadata_v2_bundle_manifest.json ]; then
            previous_manifest="previous-v2/tcia_metadata_v2_bundle_manifest.json"
          fi
          changed_args=(
            --current "$publish_dir/tcia_metadata_v2_bundle_manifest.json"
          )
          if [ -n "$previous_manifest" ]; then
            changed_args+=(--previous "$previous_manifest")
          fi
          mapfile -t changed_names < <(python scripts/tcia_v2_bundle.py changed-assets "${changed_args[@]}")
          payload_assets=()
          for asset in "${changed_names[@]}"; do
            if [ -n "$asset" ]; then
              payload_assets+=("$publish_dir/$asset")
            fi
          done
          if [ "${#payload_assets[@]}" -gt 0 ]; then
            gh release upload "$tag" "${payload_assets[@]}" --clobber
          fi
          while read -r asset; do
            if [ ! -f "$publish_dir/$asset" ]; then
              gh release delete-asset "$tag" "$asset" --yes
            fi
          done < <(gh release view "$tag" --json assets --jq '.assets[].name')
          gh release upload "$tag" "$publish_dir/tcia_metadata_v2_bundle_manifest.json" --clobber

          python scripts/tcia_v2_bundle.py expected-assets \
            --release-contract "$release_contract" \
            --include-bundle-manifest | sort > expected-assets.txt
          gh release view "$tag" --json assets --jq '.assets[].name' | sort > published-assets.txt
          diff -u expected-assets.txt published-assets.txt
          for attempt in 1 2 3 4 5; do
            gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${tag}" > published-release.json
            if python scripts/tcia_v2_bundle.py validate-published \
              --manifest "$publish_dir/tcia_metadata_v2_bundle_manifest.json" \
              --release-json published-release.json; then
              break
            fi
            if [ "$attempt" = "5" ]; then
              exit 1
            fi
            sleep 5
          done
          gh api --method PATCH \
            "repos/${GITHUB_REPOSITORY}/git/refs/tags/${tag}" \
            -f sha="$PRODUCER_SHA" \
            -F force=true >/dev/null
          test "$(resolve_tag_sha "$tag")" = "$PRODUCER_SHA"
          trap - ERR

      - name: Confirm release publication boundaries
        run: |
          echo "This workflow publishes immutable fingerprint/date generations first."
          echo "It updates tcia-metadata-v2-latest only after immutable validation."
          echo "Validated source components arrive through a short-lived workflow artifact."
          echo "It does not deploy or reconfigure the MCP/REST service."

      - name: Report published versus deployed fingerprint lag
        if: always()
        env:
          DEPLOYED_INFO_URL: ${{ vars.TCIA_V2_DEPLOYED_INFO_URL }}
        run: |
          set -euo pipefail
          manifest_path="release-dist/tcia_metadata_v2_bundle_manifest.json"
          if [ ! -s "$manifest_path" ]; then
            echo "- Deployment lag check: skipped because no release manifest was assembled." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          published="$(python -c 'import json, sys; print(json.load(open(sys.argv[1]))["release_fingerprint"])' "$manifest_path")"
          if [ -z "$DEPLOYED_INFO_URL" ]; then
            echo "- Deployment lag check: not configured (set repository variable TCIA_V2_DEPLOYED_INFO_URL)." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if ! curl --fail --silent --show-error --location \
            --max-time 15 --retry 2 --retry-all-errors \
            "$DEPLOYED_INFO_URL" > deployed-info.json; then
            echo "::warning title=V2 deployment monitor unavailable::Could not query $DEPLOYED_INFO_URL"
            echo "- Deployment lag check: endpoint unavailable." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          deployed="$(jq -r '.v2_bundle.release_fingerprint // .release_fingerprint // empty' deployed-info.json)"
          if [ -z "$deployed" ]; then
            echo "::warning title=V2 deployment fingerprint unavailable::Endpoint response contains no release fingerprint."
            echo "- Deployment lag check: response has no fingerprint." >> "$GITHUB_STEP_SUMMARY"
          elif [ "$deployed" = "$published" ]; then
            echo "- Deployment lag check: current ($deployed)." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning title=V2 deployment lag::Published $published but deployed $deployed"
            echo "- Deployment lag check: lagging; published $published, deployed $deployed." >> "$GITHUB_STEP_SUMMARY"
          fi
