name: Build TCIA metadata V2

on:
  workflow_run:
    workflows: ["Update TCIA metadata snapshot"]
    types: [completed]
  workflow_dispatch:
    inputs:
      publish_channel:
        description: "Choose a release channel after validation"
        required: true
        default: "none"
        type: choice
        options:
          - "none"
          - "preview"
          - "stable"
      immutable_tag:
        description: "Optional immutable tag for a stable promotion, for example tcia-metadata-v2-2026.08"
        required: false
        type: string
      include_pathdb_files:
        description: "Include the full PathDB file inventory"
        required: true
        default: "true"
        type: choice
        options:
          - "true"
          - "false"
      checkpoint_legacy_detail:
        description: "Embed exact specialized NIfTI/pathology rows in the public audit candidate"
        required: true
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
      release_contract:
        description: "Build the current release contract or a non-publishing streamlined candidate"
        required: true
        default: "full"
        type: choice
        options:
          - "full"
          - "streamlined_candidate"

permissions:
  contents: write

concurrency:
  group: tcia-metadata-v2
  cancel-in-progress: false

jobs:
  build:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Validate transition candidate inputs
        if: github.event_name == 'workflow_dispatch' && inputs.release_contract == 'streamlined_candidate'
        run: |
          if [ "${{ inputs.checkpoint_legacy_detail }}" != "true" ]; then
            echo "::error::The streamlined candidate requires checkpoint_legacy_detail=true."
            exit 1
          fi
          if [ "${{ inputs.publish_channel }}" != "none" ]; then
            echo "::error::The streamlined contract is evaluation-only and cannot be published."
            exit 1
          fi

      - name: Capture and download the source release without changing it
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p cache dist
          legacy_tag="tcia-snapshot-latest"
          gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${legacy_tag}" > cache/source_release.json
          for asset in \
            tcia_snapshot.sqlite.gz \
            tcia_snapshot_manifest.json \
            nifti_metadata.sqlite.gz \
            nifti_metadata_manifest.json \
            pathology_metadata.sqlite.gz \
            pathology_metadata_manifest.json \
            controlled_access_metadata.sqlite.gz \
            controlled_access_metadata_manifest.json \
            clinical_metadata.sqlite.gz \
            clinical_metadata_manifest.json \
            clinical_qc_manual_review.csv; do
            gh release download "$legacy_tag" --pattern "$asset" --dir dist --clobber
          done
          python scripts/tcia_v2_bundle.py validate-source \
            --asset-dir dist \
            --source-release-json cache/source_release.json
          for asset in \
            tcia_snapshot.sqlite.gz \
            nifti_metadata.sqlite.gz \
            pathology_metadata.sqlite.gz \
            controlled_access_metadata.sqlite.gz \
            clinical_metadata.sqlite.gz; do
            gzip -dc "dist/$asset" > "cache/${asset%.gz}"
          done

      - name: Build the runner-local V2 staging ledger
        run: |
          python scripts/tcia_v2_staging.py build \
            --snapshot-db cache/tcia_snapshot.sqlite \
            --snapshot-manifest dist/tcia_snapshot_manifest.json \
            --nifti-db cache/nifti_metadata.sqlite \
            --nifti-manifest dist/nifti_metadata_manifest.json \
            --pathology-db cache/pathology_metadata.sqlite \
            --pathology-manifest dist/pathology_metadata_manifest.json \
            --controlled-access-db cache/controlled_access_metadata.sqlite \
            --controlled-access-manifest dist/controlled_access_metadata_manifest.json \
            --clinical-db cache/clinical_metadata.sqlite \
            --clinical-manifest dist/clinical_metadata_manifest.json \
            --source-release-json cache/source_release.json \
            --out cache/tcia_metadata_v2_staging.sqlite \
            --replace
          python scripts/tcia_v2_staging.py validate \
            --db cache/tcia_metadata_v2_staging.sqlite \
            --verify-sources

      - name: Restore unchanged legacy-detail transition checkpoint
        if: github.event_name == 'workflow_dispatch' && inputs.checkpoint_legacy_detail == 'true'
        uses: actions/cache@v4
        with:
          path: cache/tcia_v2_legacy_detail_checkpoint.sqlite.gz
          key: tcia-v2-legacy-detail-${{ hashFiles('dist/nifti_metadata_manifest.json', 'dist/pathology_metadata_manifest.json') }}

      - name: Regenerate the complete web export set from the bundled snapshot
        run: |
          python scripts/tcia_v2_bundle.py exports \
            --snapshot-db cache/tcia_snapshot.sqlite \
            --out-dir dist

      - name: Build public non-DICOM metadata
        run: |
          set -euo pipefail
          pathdb_args=()
          if [ "${{ inputs.include_pathdb_files }}" = "false" ]; then
            pathdb_args+=(--no-pathdb-files)
          fi
          python scripts/tcia_public_non_dicom_metadata.py build \
            --staging-db cache/tcia_metadata_v2_staging.sqlite \
            --crosswalk-csv references/public_non_dicom_crosswalks_v1.csv \
            --crosswalk-curation references/public-non-dicom-crosswalk-curation-v1.json \
            --image-metadata-csv references/public_non_dicom_image_metadata_v1.csv \
            --out cache/public_non_dicom_metadata.sqlite \
            --replace \
            "${pathdb_args[@]}"
          python scripts/tcia_public_non_dicom_metadata.py validate \
            --db cache/public_non_dicom_metadata.sqlite
          mkdir -p cache/reports
          checkpoint_args=()
          parity_args=()
          if [ "${{ inputs.checkpoint_legacy_detail }}" = "true" ]; then
            if [ -s cache/tcia_v2_legacy_detail_checkpoint.sqlite.gz ]; then
              gzip -dc cache/tcia_v2_legacy_detail_checkpoint.sqlite.gz \
                > cache/tcia_v2_legacy_detail_checkpoint.sqlite
            else
              python scripts/tcia_v2_checkpoint.py build \
                --staging-db cache/tcia_metadata_v2_staging.sqlite \
                --out cache/tcia_v2_legacy_detail_checkpoint.sqlite \
                --replace
              gzip -1 -c cache/tcia_v2_legacy_detail_checkpoint.sqlite \
                > cache/tcia_v2_legacy_detail_checkpoint.sqlite.gz
            fi
            python scripts/tcia_v2_checkpoint.py validate \
              --db cache/tcia_v2_legacy_detail_checkpoint.sqlite
            checkpoint_args+=(--checkpoint-db cache/tcia_v2_legacy_detail_checkpoint.sqlite)
            checkpoint_args+=(--consume-checkpoint)
            parity_args+=(
              --audit-db cache/tcia_v2_legacy_detail_checkpoint.sqlite
              --require-retirement-ready
            )
          fi
          python scripts/tcia_v2_parity.py \
            --public-db cache/public_non_dicom_metadata.sqlite \
            --nifti-db cache/nifti_metadata.sqlite \
            --pathology-db cache/pathology_metadata.sqlite \
            --out cache/reports/tcia_v2_legacy_detail_parity.json \
            "${parity_args[@]}"
          # The public artifact has absorbed these sources; free runner space
          # before producing the research and audit outputs.
          rm -f cache/nifti_metadata.sqlite cache/pathology_metadata.sqlite
          if [ "${{ inputs.release_contract }}" = "streamlined_candidate" ]; then
            mv cache/public_non_dicom_metadata.sqlite cache/public_non_dicom_assembly.sqlite
            python scripts/tcia_v2_audit.py project-v3 \
              --artifact public_non_dicom \
              --db cache/public_non_dicom_assembly.sqlite \
              --research-out cache/public_non_dicom_metadata.sqlite \
              --audit-out cache/public_non_dicom_audit.sqlite \
              --research-gzip-out dist/public_non_dicom_metadata.sqlite.gz \
              --research-manifest-out dist/public_non_dicom_metadata_manifest.json \
              --audit-gzip-out dist/public_non_dicom_audit.sqlite.gz \
              --audit-manifest-out dist/public_non_dicom_audit_manifest.json \
              --staging-db cache/tcia_metadata_v2_staging.sqlite \
              --gzip-level 3 \
              --metrics-out cache/reports/tcia_v2_compact_audit_metrics.json \
              "${checkpoint_args[@]}" \
              --replace
            python scripts/tcia_v2_audit.py verify-reconstruction \
              --source-db cache/public_non_dicom_assembly.sqlite \
              --audit-db cache/public_non_dicom_audit.sqlite \
              --sample-size 1000 \
              --out cache/reports/tcia_v2_compact_audit_reconstruction.json
            rm -f cache/public_non_dicom_assembly.sqlite
            {
              echo "### Compact V2 audit candidate"
              python -c 'import json; d=json.load(open("cache/reports/tcia_v2_compact_audit_metrics.json")); s=d["output_sizes"]; print("- Projection: {:.1f} seconds\n- Compression: {:.1f} seconds\n- Research SQLite/gzip: {:,} / {:,} bytes\n- Audit SQLite/gzip: {:,} / {:,} bytes".format(d["total_projection_seconds"],d["compression"]["compression_seconds"],s["research_sqlite_bytes"],s["research_gzip_bytes"],s["audit_sqlite_bytes"],s["audit_gzip_bytes"]))'
            } >> "$GITHUB_STEP_SUMMARY"
          else
            python scripts/tcia_v2_audit.py split \
              --artifact public_non_dicom \
              --db cache/public_non_dicom_metadata.sqlite \
              --audit-out cache/public_non_dicom_audit.sqlite \
              --research-gzip-out dist/public_non_dicom_metadata.sqlite.gz \
              --research-manifest-out dist/public_non_dicom_metadata_manifest.json \
              --audit-gzip-out dist/public_non_dicom_audit.sqlite.gz \
              --audit-manifest-out dist/public_non_dicom_audit_manifest.json \
              --staging-db cache/tcia_metadata_v2_staging.sqlite \
              "${checkpoint_args[@]}" \
              --replace
          fi
          python scripts/tcia_public_non_dicom_metadata.py validate \
            --db cache/public_non_dicom_metadata.sqlite
          python scripts/tcia_v2_audit.py validate \
            --artifact public_non_dicom \
            --db cache/public_non_dicom_audit.sqlite

      - name: Build Participant Inventory
        run: |
          python scripts/tcia_participant_inventory.py build \
            --snapshot-db cache/tcia_snapshot.sqlite \
            --public-db cache/public_non_dicom_metadata.sqlite \
            --controlled-db cache/controlled_access_metadata.sqlite \
            --clinical-db cache/clinical_metadata.sqlite \
            --out cache/participant_inventory.sqlite \
            --replace
          python scripts/tcia_participant_inventory.py validate \
            --db cache/participant_inventory.sqlite
          # Participant Inventory is now self-contained for search/summary.
          rm -f cache/clinical_metadata.sqlite cache/controlled_access_metadata.sqlite
          python scripts/tcia_v2_audit.py split \
            --artifact participant_inventory \
            --db cache/participant_inventory.sqlite \
            --audit-out cache/participant_inventory_audit.sqlite \
            --clinical-qc-csv dist/clinical_qc_manual_review.csv \
            --research-gzip-out dist/participant_inventory.sqlite.gz \
            --research-manifest-out dist/participant_inventory_manifest.json \
            --audit-gzip-out dist/participant_inventory_audit.sqlite.gz \
            --audit-manifest-out dist/participant_inventory_audit_manifest.json \
            --replace
          python scripts/tcia_participant_inventory.py validate \
            --db cache/participant_inventory.sqlite
          python scripts/tcia_v2_audit.py validate \
            --artifact participant_inventory \
            --db cache/participant_inventory_audit.sqlite

      - name: Run V2 contract tests
        run: |
          python -m unittest \
            scripts.tests.test_tcia_artifact_model \
            scripts.tests.test_tcia_v2_audit \
            scripts.tests.test_tcia_v2_checkpoint \
            scripts.tests.test_tcia_v2_parity \
            scripts.tests.test_tcia_v2_staging \
            scripts.tests.test_tcia_v2_bundle

      - name: Retain staging diagnostics for maintainers
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: tcia-metadata-v2-staging-diagnostics
          path: |
            cache/tcia_metadata_v2_staging.sqlite
            cache/reports/tcia_v2_legacy_detail_parity.json
            cache/reports/tcia_v2_compact_audit_metrics.json
            cache/reports/tcia_v2_compact_audit_reconstruction.json
          if-no-files-found: ignore
          retention-days: 30

      - name: Build and validate the complete V2 bundle contract
        run: |
          release_channel="stable"
          release_tag="tcia-metadata-v2-latest"
          release_contract="${{ inputs.release_contract || 'full' }}"
          if [ "${{ inputs.publish_channel }}" = "preview" ]; then
            release_channel="preview"
            release_tag="tcia-metadata-v2-preview"
          fi
          if [ "$release_contract" = "streamlined_candidate" ]; then
            release_channel="candidate"
            release_tag="tcia-metadata-v2-streamlined-candidate"
          fi
          python scripts/tcia_v2_bundle.py build \
            --asset-dir dist \
            --source-release-json cache/source_release.json \
            --release-channel "$release_channel" \
            --release-tag "$release_tag" \
            --producer-commit "$GITHUB_SHA" \
            --producer-skill-version "$(python -c 'import json; print(json.load(open("skill_version.json"))["skill_version"])')" \
            --release-contract "$release_contract" \
            --out dist/tcia_metadata_v2_bundle_manifest.json
          python scripts/tcia_v2_bundle.py validate \
            --asset-dir dist \
            --manifest dist/tcia_metadata_v2_bundle_manifest.json
          if [ "$release_contract" = "streamlined_candidate" ]; then
            if [ "${{ inputs.checkpoint_legacy_detail }}" != "true" ]; then
              echo "::error::The streamlined candidate requires checkpoint_legacy_detail=true."
              exit 1
            fi
            if [ "${{ inputs.publish_channel }}" != "none" ]; then
              echo "::error::The streamlined contract is evaluation-only and cannot be published."
              exit 1
            fi
            python scripts/tcia_v2_bundle.py materialize \
              --asset-dir dist \
              --manifest dist/tcia_metadata_v2_bundle_manifest.json \
              --out-dir candidate-dist
          fi

      - name: Decide whether to publish V2 release assets
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          publish_requested="false"
          channel="${{ inputs.publish_channel }}"
          tag=""
          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            if gh release view tcia-metadata-v2-latest >/dev/null 2>&1; then
              channel="stable"
            else
              channel="none"
              echo "::notice::Stable V2 publication requires an initial manual promotion with an immutable tag."
            fi
          fi
          if [ "$channel" != "none" ] && [ -n "$channel" ]; then
            publish_requested="true"
          fi
          if [ "$publish_requested" = "true" ] && [ "${{ inputs.include_pathdb_files }}" = "false" ]; then
            echo "::error::Published V2 bundles must include the full PathDB inventory."
            exit 1
          fi
          if [ "$channel" = "stable" ] \
             && ! gh release view tcia-metadata-v2-latest >/dev/null 2>&1 \
             && [ -z "${{ inputs.immutable_tag }}" ]; then
            echo "::error::The initial stable promotion requires immutable_tag."
            exit 1
          fi

          publish="false"
          reason="publication not requested"
          if [ "$publish_requested" = "true" ]; then
            tag="tcia-metadata-v2-latest"
            if [ "$channel" = "preview" ]; then
              tag="tcia-metadata-v2-preview"
            fi
            new_fingerprint="$(python -c 'import json; print(json.load(open("dist/tcia_metadata_v2_bundle_manifest.json"))["release_fingerprint"])')"
            old_fingerprint=""
            mkdir -p previous-v2
            if gh release download "$tag" --pattern tcia_metadata_v2_bundle_manifest.json --dir previous-v2 --clobber >/dev/null 2>&1; then
              old_fingerprint="$(python -c 'import json; print(json.load(open("previous-v2/tcia_metadata_v2_bundle_manifest.json")).get("release_fingerprint", ""))')"
            fi
            if [ "$new_fingerprint" != "$old_fingerprint" ]; then
              publish="true"
              reason="complete V2 bundle fingerprint changed"
            else
              reason="complete V2 bundle fingerprint unchanged"
            fi
          fi
          echo "publish=$publish" >> "$GITHUB_OUTPUT"
          echo "channel=$channel" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "reason=$reason" >> "$GITHUB_OUTPUT"
          echo "### V2 release decision" >> "$GITHUB_STEP_SUMMARY"
          echo "- Publish: $publish" >> "$GITHUB_STEP_SUMMARY"
          echo "- Reason: $reason" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload complete current-contract workflow artifact for evaluation
        if: github.event_name == 'workflow_dispatch' && inputs.publish_channel == 'none' && inputs.release_contract == 'full'
        uses: actions/upload-artifact@v6
        with:
          name: tcia-metadata-v2-candidate
          path: dist/*
          compression-level: 0
          retention-days: 30

      - name: Upload streamlined workflow artifact for evaluation
        if: github.event_name == 'workflow_dispatch' && inputs.publish_channel == 'none' && inputs.release_contract == 'streamlined_candidate'
        uses: actions/upload-artifact@v6
        with:
          name: tcia-metadata-v2-streamlined-candidate
          path: candidate-dist/*
          compression-level: 0
          retention-days: 30

      - name: Publish validated V2 release
        if: steps.release.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${{ steps.release.outputs.tag }}"
          channel="${{ steps.release.outputs.channel }}"
          notes="TCIA Metadata Artifact Model V2 bundle. The manifest defines research-core, research-detail, audit-support, and compatibility-export profiles. Participant Inventory is compact by default; file-grain metadata and verbose audit evidence are optional hash-pinned companions. Public DICOM detail remains authoritative in IDC. The legacy tcia-snapshot-latest release is retained as a compatibility line."
          prerelease_args=()
          title="TCIA metadata V2 latest"
          if [ "$channel" = "preview" ]; then
            prerelease_args+=(--prerelease)
            title="TCIA metadata V2 preview"
          fi
          immutable_tag="${{ inputs.immutable_tag }}"
          if [ "$channel" = "stable" ] && [ -n "$immutable_tag" ]; then
            case "$immutable_tag" in
              tcia-metadata-v2-[0-9][0-9][0-9][0-9].[0-9][0-9]*) ;;
              *)
                echo "::error::immutable_tag must start with tcia-metadata-v2-YYYY.MM"
                exit 1
                ;;
            esac
            if gh release view "$immutable_tag" >/dev/null 2>&1; then
              echo "::error::Immutable release already exists: $immutable_tag"
              exit 1
            fi
            gh release create "$immutable_tag" dist/* \
              --title "TCIA metadata V2 ${immutable_tag#tcia-metadata-v2-}" \
              --notes "$notes"
            gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${immutable_tag}" > immutable-release.json
            python scripts/tcia_v2_bundle.py validate-published \
              --manifest dist/tcia_metadata_v2_bundle_manifest.json \
              --release-json immutable-release.json
          fi
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" \
              "${prerelease_args[@]}" \
              --title "$title" \
              --notes "$notes"
          else
            gh release edit "$tag" \
              "${prerelease_args[@]}" \
              --title "$title" \
              --notes "$notes"
          fi
          previous_manifest=""
          if [ -s previous-v2/tcia_metadata_v2_bundle_manifest.json ]; then
            previous_manifest="previous-v2/tcia_metadata_v2_bundle_manifest.json"
          fi
          changed_args=(
            --current dist/tcia_metadata_v2_bundle_manifest.json
          )
          if [ -n "$previous_manifest" ]; then
            changed_args+=(--previous "$previous_manifest")
          fi
          mapfile -t changed_names < <(python scripts/tcia_v2_bundle.py changed-assets "${changed_args[@]}")
          payload_assets=()
          for asset in "${changed_names[@]}"; do
            if [ -n "$asset" ]; then
              payload_assets+=("dist/$asset")
            fi
          done
          if [ "${#payload_assets[@]}" -gt 0 ]; then
            gh release upload "$tag" "${payload_assets[@]}" --clobber
          fi
          while read -r asset; do
            if [ ! -f "dist/$asset" ]; then
              gh release delete-asset "$tag" "$asset" --yes
            fi
          done < <(gh release view "$tag" --json assets --jq '.assets[].name')
          gh release upload "$tag" dist/tcia_metadata_v2_bundle_manifest.json --clobber

          python scripts/tcia_v2_bundle.py expected-assets --include-bundle-manifest | sort > expected-assets.txt
          gh release view "$tag" --json assets --jq '.assets[].name' | sort > published-assets.txt
          diff -u expected-assets.txt published-assets.txt
          for attempt in 1 2 3 4 5; do
            gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${tag}" > published-release.json
            if python scripts/tcia_v2_bundle.py validate-published \
              --manifest dist/tcia_metadata_v2_bundle_manifest.json \
              --release-json published-release.json; then
              break
            fi
            if [ "$attempt" = "5" ]; then
              exit 1
            fi
            sleep 5
          done
          gh api --method PATCH \
            "repos/${GITHUB_REPOSITORY}/git/refs/tags/${tag}" \
            -f sha="$GITHUB_SHA" \
            -F force=true >/dev/null
          published_tag_sha="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${tag}" --jq '.object.sha')"
          test "$published_tag_sha" = "$GITHUB_SHA"

      - name: Confirm legacy release isolation
        run: |
          echo "This workflow never uploads to or modifies tcia-snapshot-latest."
          echo "It does not deploy or reconfigure the MCP/REST service."
