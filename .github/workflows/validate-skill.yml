name: Validate TCIA query skill

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Validate skill version manifest
        run: python scripts/tcia_skill_version.py check

      - name: Compile all Python sources
        run: |
          python -m compileall -q scripts mcp_server

      - name: Run full deterministic script suite
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python -m unittest discover -s scripts/tests -p 'test_*.py'

      - name: Install pinned optional MCP and REST dependencies
        run: python -m pip install --requirement requirements-ci.txt

      - name: Verify optional server dependencies explicitly
        run: |
          python - <<'PY'
          import fastapi, mcp, pydantic, uvicorn
          print("optional MCP/REST imports: ok")
          PY

      - name: Run full MCP and REST suite
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python -m unittest discover -s mcp_server/tests -p 'test_*.py'
