name: Build TCIA metadata V2 source inputs

on:
  workflow_dispatch:
    inputs:
      refresh_all_clinical_downloads:
        description: "Re-fetch every public official clinical artifact instead of reusing unchanged rows"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
      refresh_idc_clinical:
        description: "Re-fetch IDC clinical tables even when the IDC release version is unchanged"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
      refresh_cda:
        description: "Re-harvest CDA clinical rows even when its release fingerprint is unchanged"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
  schedule:
    - cron: "17 7,19 * * *"
      timezone: "America/New_York"

permissions:
  contents: read

concurrency:
  group: tcia-metadata-v2-source
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Initialize diagnostics-only status
        run: |
          python3 scripts/tcia_diagnostic_status.py init \
            --out dist/metadata_diagnostic_status.json \
            --run-id "${{ github.run_id }}" \
            --run-attempt "${{ github.run_attempt }}"

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Install pinned metadata dependencies
        run: python -m pip install --require-hashes --requirement requirements-build.lock

      - name: Prepare previous snapshot fallback
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="tcia-metadata-v2-latest"
          mkdir -p previous
          if gh release download "$tag" --pattern tcia_snapshot.sqlite.gz --dir previous >/dev/null 2>&1; then
            if gzip -dc previous/tcia_snapshot.sqlite.gz > previous/tcia_snapshot.sqlite; then
              echo "Previous snapshot is available for source fallback."
            else
              echo "::warning::Previous snapshot could not be decompressed; source fallback disabled."
              rm -f previous/tcia_snapshot.sqlite previous/tcia_snapshot.sqlite.gz
            fi
          else
            echo "No previous snapshot release found; source fallback disabled."
          fi

      - name: Build snapshot
        run: |
          mkdir -p dist
          fallback_args=()
          if [ -s previous/tcia_snapshot.sqlite ]; then
            fallback_args+=(--fallback-db previous/tcia_snapshot.sqlite)
          fi
          python scripts/tcia_snapshot.py build \
            --out dist/tcia_snapshot.sqlite \
            --gzip-out dist/tcia_snapshot.sqlite.gz \
            --manifest-out dist/tcia_snapshot_manifest.json \
            --exports-dir dist \
            "${fallback_args[@]}"

      - name: Validate snapshot artifacts
        run: |
          python scripts/tcia_snapshot.py validate \
            --db dist/tcia_snapshot.sqlite \
            --exports-dir dist

      - name: Build controlled-access metadata
        run: |
          python scripts/tcia_controlled_access_metadata.py build \
            --snapshot-db dist/tcia_snapshot.sqlite \
            --out dist/controlled_access_metadata.sqlite \
            --artifact-dir dist/controlled_access_source_artifacts \
            --gzip-out dist/controlled_access_metadata.sqlite.gz \
            --manifest-out dist/controlled_access_metadata_manifest.json \
            --replace

      - name: Validate controlled-access metadata
        run: |
          python scripts/tcia_controlled_access_metadata.py validate \
            --db dist/controlled_access_metadata.sqlite

      - name: Prepare previous clinical metadata
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="tcia-metadata-v2-latest"
          mkdir -p previous
          if gh release download "$tag" --pattern clinical_metadata.sqlite.gz --dir previous --clobber >/dev/null 2>&1; then
            if gzip -dc previous/clinical_metadata.sqlite.gz > previous/clinical_metadata.sqlite; then
              echo "Previous clinical metadata is available for incremental reuse."
            else
              echo "::warning::Previous clinical metadata could not be decompressed; clinical sources will be rebuilt."
              rm -f previous/clinical_metadata.sqlite previous/clinical_metadata.sqlite.gz
            fi
          else
            echo "::warning title=Clinical baseline missing::No previous clinical_metadata.sqlite.gz exists. Official TCIA, IDC, and CDA clinical rows will be harvested; only legacy DICOM fallback rows require a prior artifact."
          fi

      - name: Build patient-level clinical metadata
        run: |
          set -euo pipefail
          clinical_args=()
          if [ -s previous/clinical_metadata.sqlite ]; then
            clinical_args+=(--previous-db previous/clinical_metadata.sqlite)
          fi
          if [ "${{ inputs.refresh_all_clinical_downloads || 'false' }}" = "true" ]; then
            clinical_args+=(--refresh-all-official)
          fi
          if [ "${{ inputs.refresh_idc_clinical || 'false' }}" = "true" ]; then
            clinical_args+=(--refresh-idc-clinical)
          fi
          if [ "${{ inputs.refresh_cda || 'false' }}" = "true" ]; then
            clinical_args+=(--refresh-cda)
          fi
          python scripts/tcia_clinical_metadata.py build \
            --snapshot-db dist/tcia_snapshot.sqlite \
            --out dist/clinical_metadata.sqlite \
            --gzip-out dist/clinical_metadata.sqlite.gz \
            --manifest-out dist/clinical_metadata_manifest.json \
            --replace \
            "${clinical_args[@]}"

      - name: Validate patient-level clinical metadata
        run: |
          python scripts/tcia_clinical_metadata.py validate \
            --db dist/clinical_metadata.sqlite
          python scripts/tcia_clinical_metadata.py export-qc \
            --db dist/clinical_metadata.sqlite \
            --out dist/clinical_qc_manual_review.csv

      - name: Import only a verified prior correction registry
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="tcia-metadata-v2-latest"
          mkdir -p previous
          if ! gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${tag}" \
            > previous/release.json; then
            echo "::error title=Prior V2 release retrieval failed::Cannot establish whether the correction component exists."
            exit 1
          fi
          gh release download "$tag" \
            --pattern tcia_metadata_v2_bundle_manifest.json \
            --dir previous --clobber
          if jq -e '.assets["tcia_correction_registry.sqlite.gz"]' \
            previous/tcia_metadata_v2_bundle_manifest.json >/dev/null; then
              gh release download "$tag" \
                --pattern tcia_correction_registry.sqlite.gz \
                --dir previous --clobber
              python scripts/tcia_v2_bundle.py validate-selection \
                --asset-dir previous \
                --manifest previous/tcia_metadata_v2_bundle_manifest.json \
                --source-release-json previous/release.json \
                --asset tcia_correction_registry.sqlite.gz
              gzip -dc previous/tcia_correction_registry.sqlite.gz \
                > previous/tcia_correction_registry.sqlite
              python scripts/tcia_correction_registry.py validate \
                --db previous/tcia_correction_registry.sqlite
              prior_fingerprint="$(jq -r '.release_fingerprint' previous/tcia_metadata_v2_bundle_manifest.json)"
              prior_date="$(jq -r '.generated_at_utc[:10] | gsub("-"; ".")' previous/tcia_metadata_v2_bundle_manifest.json)"
              immutable_tag="tcia-metadata-v2-${prior_date}-${prior_fingerprint:0:12}"
              gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${immutable_tag}" \
                > previous/immutable-release.json
              python scripts/tcia_v2_bundle.py validate-published \
                --manifest previous/tcia_metadata_v2_bundle_manifest.json \
                --release-json previous/immutable-release.json
              prior_health="$(jq -r '.decision_sets.correction_registry.status' previous/tcia_metadata_v2_bundle_manifest.json)"
              python scripts/tcia_correction_registry.py link-release \
                --db previous/tcia_correction_registry.sqlite \
                --release-fingerprint "$prior_fingerprint" \
                --release-tag "$immutable_tag" \
                --source-health "$prior_health" \
                --observed-at "$(jq -r '.generated_at_utc' previous/tcia_metadata_v2_bundle_manifest.json)"
              cp previous/tcia_correction_registry.sqlite \
                dist/tcia_correction_registry.sqlite
          else
            echo "Verified prior contract lacks the correction component; establishing its exact baseline."
          fi

      - name: Build and package the correction registry
        run: |
          set -euo pipefail
          observed_at="$(jq -r '.generated_at_utc' dist/tcia_snapshot_manifest.json)"
          python scripts/tcia_correction_registry.py build \
            --snapshot dist/tcia_snapshot.sqlite \
            --snapshot-manifest dist/tcia_snapshot_manifest.json \
            --observed-at "$observed_at" \
            --out dist/tcia_correction_registry.sqlite \
            --replace
          python scripts/tcia_correction_registry.py validate \
            --db dist/tcia_correction_registry.sqlite
          if [ -s previous/tcia_metadata_v2_bundle_manifest.json ] && \
             ! jq -e '.assets["tcia_correction_registry.sqlite.gz"]' \
               previous/tcia_metadata_v2_bundle_manifest.json >/dev/null; then
            python scripts/tcia_correction_registry.py record-initial-bootstrap \
              --db dist/tcia_correction_registry.sqlite \
              --prior-manifest previous/tcia_metadata_v2_bundle_manifest.json \
              --prior-release-json previous/release.json \
              --evidence-out dist/tcia_correction_registry_bootstrap_evidence.json \
              --observed-at "$observed_at"
          fi
          python scripts/tcia_correction_registry.py validate \
            --db dist/tcia_correction_registry.sqlite \
            | tee dist/tcia_correction_registry_validation.json

      - name: Prepare previous sidecars for change reporting
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="tcia-metadata-v2-latest"
          mkdir -p previous

          if gh release download "$tag" \
            --pattern controlled_access_metadata.sqlite.gz \
            --dir previous --clobber >/dev/null 2>&1; then
            if ! gzip -dc previous/controlled_access_metadata.sqlite.gz \
              > previous/controlled_access_metadata.sqlite; then
              echo "::warning title=Controlled-access comparison unavailable::The previous controlled-access SQLite could not be decompressed."
              rm -f previous/controlled_access_metadata.sqlite
            fi
          else
            echo "::warning title=Controlled-access comparison baseline::No previous controlled-access SQLite was found; this run will establish the comparison baseline."
          fi

      - name: Report SQLite additions and clinical review flags
        run: |
          set -euo pipefail
          status_file=dist/metadata_diagnostic_status.json
          report_json=dist/metadata_change_report.json
          report_markdown=dist/metadata_change_report.md
          python scripts/tcia_diagnostic_status.py update \
            --status "$status_file" \
            --stage semantic_report_started \
            --disposition pending
          report_args=(
            --snapshot-new dist/tcia_snapshot.sqlite
            --controlled-new dist/controlled_access_metadata.sqlite
            --clinical-new dist/clinical_metadata.sqlite
            --correction-new dist/tcia_correction_registry.sqlite
            --explanations-db dist/tcia_correction_registry.sqlite
          )
          if [ -s previous/tcia_snapshot.sqlite ]; then
            report_args+=(--snapshot-old previous/tcia_snapshot.sqlite)
          fi
          if [ -s previous/controlled_access_metadata.sqlite ]; then
            report_args+=(
              --controlled-old previous/controlled_access_metadata.sqlite
            )
          fi
          if [ -s previous/clinical_metadata.sqlite ]; then
            report_args+=(--clinical-old previous/clinical_metadata.sqlite)
          fi
          if [ -s previous/tcia_correction_registry.sqlite ]; then
            report_args+=(--correction-old previous/tcia_correction_registry.sqlite)
          fi
          set +e
          python scripts/tcia_metadata_change_report.py \
            "${report_args[@]}" \
            --github-actions \
            --fail-on-unexplained-high \
            --markdown-out "$report_markdown" \
            --json-out "$report_json"
          report_exit=$?
          set -e
          if [ "$report_exit" -eq 2 ]; then
            report_disposition=unexplained_high_rejected
          elif [ "$report_exit" -eq 0 ]; then
            report_disposition=semantic_report_passed
          else
            report_disposition=failed_before_report_serialization
          fi
          python scripts/tcia_diagnostic_status.py update \
            --status "$status_file" \
            --stage semantic_report_completed \
            --disposition "$report_disposition" \
            --exit-code "$report_exit" \
            --report-json "$report_json" \
            --report-markdown "$report_markdown"
          if [ "$report_exit" -ne 0 ]; then
            exit "$report_exit"
          fi
          if ! python scripts/tcia_correction_registry.py consume-explanations \
            --db dist/tcia_correction_registry.sqlite \
            --report "$report_json"; then
            python scripts/tcia_diagnostic_status.py update \
              --status "$status_file" \
              --stage semantic_explanation_consumption_failed \
              --disposition failed \
              --exit-code 1 \
              --report-json "$report_json" \
              --report-markdown "$report_markdown"
            exit 1
          fi
          if ! python scripts/tcia_correction_registry.py package \
            --db dist/tcia_correction_registry.sqlite \
            --gzip-out dist/tcia_correction_registry.sqlite.gz \
            --manifest-out dist/tcia_correction_registry_manifest.json; then
            python scripts/tcia_diagnostic_status.py update \
              --status "$status_file" \
              --stage correction_registry_packaging_failed \
              --disposition failed \
              --exit-code 1 \
              --report-json "$report_json" \
              --report-markdown "$report_markdown"
            exit 1
          fi
          cat "$report_markdown" >> "$GITHUB_STEP_SUMMARY"
          python scripts/tcia_diagnostic_status.py update \
            --status "$status_file" \
            --stage source_artifacts_validated \
            --disposition success \
            --exit-code 0 \
            --report-json "$report_json" \
            --report-markdown "$report_markdown"

      - name: Finalize diagnostics-only status
        if: ${{ always() }}
        run: |
          python3 scripts/tcia_diagnostic_status.py finalize \
            --status dist/metadata_diagnostic_status.json \
            --job-status "${{ job.status }}" \
            --report-json dist/metadata_change_report.json \
            --report-markdown dist/metadata_change_report.md

      - name: Upload non-release semantic-gate diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: tcia-metadata-v2-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            dist/metadata_diagnostic_status.json
            dist/metadata_change_report.md
            dist/metadata_change_report.json
            dist/tcia_correction_registry_bootstrap_evidence.json
            dist/tcia_correction_registry_validation.json
          if-no-files-found: error
          compression-level: 6
          retention-days: 30

      - name: Upload validated V2 source inputs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: tcia-metadata-v2-source
          path: |
            dist/tcia_snapshot.sqlite.gz
            dist/tcia_snapshot_manifest.json
            dist/controlled_access_metadata.sqlite.gz
            dist/controlled_access_metadata_manifest.json
            dist/clinical_metadata.sqlite.gz
            dist/clinical_metadata_manifest.json
            dist/clinical_qc_manual_review.csv
            dist/tcia_correction_registry.sqlite.gz
            dist/tcia_correction_registry_manifest.json
            dist/metadata_change_report.md
            dist/metadata_change_report.json
          compression-level: 0
          retention-days: 3
